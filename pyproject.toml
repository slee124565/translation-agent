[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "translation-agent"
version = "0.1.0"
description = "Agentic workflow for machine translation using LLMs"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Andrew Ng", email = "ng@deeplearning.ai" },
]
keywords = ["translation", "agents", "LLM", "machine translation"]

requires-python = ">=3.9, <4.0"

dependencies = [
    "openai>=1.28.1, <2.0.0",
    "tiktoken>=0.6.0, <0.7.0",
    "joblib>=1.4.2, <2.0.0",
    "pysrt>=1.1.2, <2.0.0",
    "icecream>=2.1.3, <3.0.0",
    "langchain-text-splitters>=0.0.1, <0.0.2",
    "python-dotenv>=1.0.1, <2.0.0",
]

[project.urls]
repository = "https://github.com/andrewyng/translation-agent"

[project.optional-dependencies]
app = [
    "simplemma>=1.0.0, <2.0.0",
    "gradio==4.37.2",
    "python-docx>=1.1.2, <2.0.0",
    "PyMuPDF>=1.24.7, <2.0.0",
]
dev = [
    "black>=24.4.2, <25.0.0",
    "flake8>=7.0.0, <8.0.0",
    "pyright>=1.1.362, <1.2.0",
    "pre-commit>=3.7.1, <4.0.0",
    "ruff>=0.4.4, <0.5.0",
]
test = [
    "pytest>=8.2.0, <9.0.0",
    "mypy>=1.10.0, <2.0.0",
    "pytest-mock>=3.14.0, <4.0.0",
]
eval = [
    "nltk>=3.8.1, <4.0.0",
    "sacrebleu>=2.4.2, <3.0.0",
    "google-cloud-translate>=3.15.3, <4.0.0",
    "deepl>=1.18.0, <2.0.0",
    "numpy>=1.26.4, <2.0.0",
    "scipy>=1.13.0, <2.0.0",
    "gradio>=4.31.5, <5.0.0",
    "requests>=2.32.3, <3.0.0",
    "beautifulsoup4>=4.12.3, <5.0.0",
    "sentencepiece>=0.2.0, <0.3.0",
]

[tool.uv.pip]
extra-index-url = [
    "https://download.pytorch.org/whl/nightly/rocm6.0"
]

[tool.ruff]
line-length = 79
indent-width = 4
exclude = [".venv", ".env", ".git", "tests", "eval", ".jj"]

[tool.ruff.lint]
extend-select = [
    "B",
    "C4",
    "ERA",
    "I",
    "N",
    "PIE",
    "PGH",
    "RUF",
    "SIM",
    "TCH",
    "TID",
    "UP",
]
fixable = ["ALL"]
ignore = ["SIM117"]

[tool.ruff.lint.isort]
force-single-line = false
lines-after-imports = 2
known-first-party = ["translation-agent"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["E402", "F401"]
"**/{tests,docs,tools}/*" = ["E402"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
files = "src, tests"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
show_error_codes = true
strict = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
exclude = ["tests"]

